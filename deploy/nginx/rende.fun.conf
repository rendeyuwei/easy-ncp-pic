server {
    listen 80;
    listen [::]:80;
    server_name rende.fun www.rende.fun;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type text/plain;
    }

    location / {
        return 308 https://rende.fun$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.rende.fun;

    ssl_certificate /etc/letsencrypt/live/rende.fun/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rende.fun/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 308 https://rende.fun$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name rende.fun;

    ssl_certificate /etc/letsencrypt/live/rende.fun/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rende.fun/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:EasyPicTLS:10m;
    ssl_session_timeout 1d;

    include snippets/easypic-locations.conf;

    location /web {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        root /var/www/html;
        try_files $uri $uri/ =404;
    }
}
